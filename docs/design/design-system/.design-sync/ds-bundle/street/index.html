<!-- @dsCard group="Brand" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porchlight Street</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* The street fills its frame. The 2D street shows first, and stays when WebGL is unavailable. */
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--pl-3d-sky); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
  #scene.is-pointing { cursor: pointer; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--ds-space-300); }
  #fallback svg { max-width: 720px; }
  body.has-3d #fallback { opacity: 0; transition: opacity var(--pl-dur-slow) var(--pl-ease-out); pointer-events: none; }
  /* A soft vignette pulls the eye to the lit windows. */
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(3, 4, 6, 0.55) 100%); }

  .brand { position: fixed; top: var(--ds-space-200); left: var(--ds-space-200); display: flex; gap: var(--ds-space-150); align-items: center; }
  .brand__mark { width: 36px; height: 36px; border-radius: var(--ds-radius-200); display: grid; place-items: center; background: var(--pl-glow-soft); border: 1px solid var(--pl-glow-halo); box-shadow: 0 0 16px var(--pl-glow-halo); }
  .brand__name { margin: 0; font-size: var(--ds-font-size-title); line-height: var(--ds-line-title); font-weight: var(--ds-weight-bold); color: var(--ds-text-strong); letter-spacing: 0.01em; }
  .brand__sub { margin: 0; font-size: var(--ds-font-size-small); line-height: var(--ds-line-small); color: var(--ds-text-subtle); font-variant-numeric: tabular-nums; }

  .dock { position: fixed; left: 50%; bottom: var(--ds-space-200); transform: translateX(-50%); display: flex; gap: var(--ds-space-100); padding: var(--ds-space-100);
    background: var(--pl-scrim); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-300); box-shadow: var(--ds-shadow-overlay);
    transition: opacity var(--pl-dur-slow) var(--pl-ease-out), transform var(--pl-dur-slow) var(--pl-ease-out); }
  body.is-zoomed .dock { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  .dock__btn { font: inherit; color: var(--ds-text); background: transparent; border: 1px solid transparent; border-radius: var(--ds-radius-200); padding: var(--ds-space-100) var(--ds-space-150); cursor: pointer;
    display: grid; gap: var(--ds-space-050); justify-items: start; min-width: 132px; transition: transform var(--pl-dur-fast) var(--pl-ease-out); }
  .dock__btn:hover, .dock__btn.is-active { background: var(--pl-unlit); border-color: var(--ds-border); }
  .dock__btn:active { transform: scale(0.97); }
  .dock__btn:focus-visible { outline: 2px solid var(--ds-focus); outline-offset: 2px; }
  .dock__btn .pl-presence { white-space: nowrap; }
  .dock__name { display: flex; gap: var(--ds-space-100); align-items: center; font-weight: var(--ds-weight-medium); color: var(--ds-text-strong); }

  .hint { position: fixed; left: var(--ds-space-200); bottom: var(--ds-space-200); display: flex; gap: var(--ds-space-050); align-items: center; color: var(--ds-text-subtlest); font-size: var(--ds-font-size-small); }
  @media (max-width: 1100px) { .hint { display: none; } }
  .area-count { font-size: var(--ds-font-size-small); color: var(--ds-text-subtle); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div id="fallback" aria-hidden="true">
    <svg class="pl-illo" viewBox="0 0 640 220" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0 200h640"/>
      <g><path d="M40 200v-90l50-38 50 38v90"/><rect x="62" y="122" width="20" height="20" style="fill: var(--pl-glow)"/><rect x="98" y="122" width="20" height="20" style="fill: var(--pl-glow)"/><rect x="62" y="156" width="20" height="20" style="fill: var(--pl-glow)"/><rect x="98" y="156" width="20" height="20" style="fill: var(--pl-glow)"/></g>
      <g><path d="M170 200v-80l45-34 45 34v80"/><rect x="190" y="130" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="222" y="130" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="190" y="162" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="222" y="162" width="18" height="18"/></g>
      <g><path d="M290 200v-80l45-34 45 34v80"/><rect x="310" y="130" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="342" y="130" width="18" height="18"/><rect x="310" y="162" width="18" height="18"/><rect x="342" y="162" width="18" height="18"/></g>
      <g><path d="M430 200v-80l45-34 45 34v80"/><rect x="450" y="130" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="482" y="130" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="450" y="162" width="18" height="18" style="fill: var(--pl-glow)"/><rect x="482" y="162" width="18" height="18" style="fill: var(--pl-glow)"/></g>
      <g><path d="M550 200v-70l40-30 40 30v70"/><rect x="568" y="140" width="16" height="16" style="fill: var(--pl-glow)"/><rect x="596" y="140" width="16" height="16"/><rect x="568" y="168" width="16" height="16"/></g>
    </svg>
  </div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="tags" aria-hidden="true"></div>

  <header class="brand">
    <div class="brand__mark"><svg class="pl-glyph pl-glyph--lit" aria-hidden="true"><use href="#lamp"/></svg></div>
    <div><p class="brand__name">Porchlight</p><p class="brand__sub" id="team-line"></p></div>
  </header>

  <button class="pl-btn pl-btn--subtle pl-motion" id="motion" type="button" aria-pressed="false">Motion</button>
  <nav class="dock" id="dock" aria-label="Teammates"></nav>
  <div class="hint" aria-hidden="true"><span class="pl-kbd">&larr;</span><span class="pl-kbd">&rarr;</span> choose <span class="pl-kbd">Enter</span> visit <span class="pl-kbd">Esc</span> back</div>

  <aside class="pl-panel" id="panel" aria-label="Teammate details" aria-hidden="true">
    <div class="pl-panel__head" id="panel-head"></div>
    <div class="pl-panel__body" id="panel-body"></div>
    <div class="pl-panel__foot">
      <button class="pl-btn pl-btn--secondary" id="back" type="button">Back to street</button>
      <span class="pl-meta"><span class="pl-kbd">Esc</span></span>
    </div>
  </aside>

<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
  // Porchlight street, tier 3. Each house is a teammate; each window is one area of their work.
  // Lit window = captured knowledge, with sources. Dark window = a gap only that person can fill.
  // Every colour comes from a CSS token. Budget and fallbacks: docs/design/system-brief.md.
  import * as THREE from "three";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

  // Motion: follow the system's "reduce motion" setting unless the viewer chose otherwise on this page.
  const systemReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let saved = null;
  try { saved = localStorage.getItem("pl-motion"); } catch (e) { /* storage blocked: follow the system */ }
  let reduced = saved ? saved === "reduced" : systemReduced;
  const motionBtn = document.getElementById("motion");
  function applyMotion() {
    document.documentElement.dataset.motion = reduced ? "reduced" : "full";
    motionBtn.textContent = reduced ? "Motion: reduced" : "Motion: full";
    motionBtn.setAttribute("aria-pressed", String(!reduced));
    motionBtn.title = systemReduced ? "Your system asks for reduced motion. Full motion is your choice here." : "";
  }
  motionBtn.addEventListener("click", () => {
    reduced = !reduced; applyMotion();
    try { localStorage.setItem("pl-motion", reduced ? "reduced" : "full"); } catch (e) { /* not remembered */ }
  });
  applyMotion();
  const css = getComputedStyle(document.documentElement);
  const tok = (name) => new THREE.Color(css.getPropertyValue(name).trim());
  const PR = "PR #";   // "PR #", written so the design drift check doesn't read it as a colour

  // ---------- The team (demo data; real data comes from Jira in catch-up-view) ----------
  const TEAM = [
    { name: "Aisha Rahman", initials: "AR", role: "Developer", away: "Leaving · 30 Nov", status: "Leaving 30 Nov 2026", areas: [
      { title: "Why payments retry 3 times", lit: true, text: "The bank API times out under load at month end. Three retries, 2 seconds apart, cleared every timeout in testing.", src: ["PAY-142", PR + "318", "Interview"] },
      { title: "Bank API timeout logging", lit: true, text: "Every timeout logs the bank's request ID, so support can trace it with the bank.", src: ["PAY-118"] },
      { title: "Settlement file double check", lit: true, text: "The bank once sent a truncated file at year-end; the second check catches a short file before posting.", src: ["PAY-131", PR + "322"] },
      { title: "Refund webhook ordering", lit: true, text: "Webhooks can arrive out of order; refunds are applied by event time, not arrival time.", src: ["PAY-127"] },
      { title: "Why the year-end batch runs at 23:00", lit: false, text: "The bank's settlement file lands at 22:30; 23:00 leaves a 30-minute buffer.", src: ["PAY-150", "Interview"] },
      { title: "Scheduler migration plan", lit: false, text: "Move one job per week, oldest first, with the old scheduler kept as a fallback for a month.", src: ["PAY-150"] },
    ] },
    { name: "Daniel Tan", initials: "DT", role: "Tester", areas: [
      { title: "Payment regression suite", lit: true, text: "212 cases; the 14 tagged month-end run nightly in the last week of each month.", src: ["QA-41"] },
      { title: "Month-end load test", lit: true, text: "3x normal volume for 2 hours, matching last December's peak.", src: ["QA-52"] },
      { title: "Refund edge cases", lit: true, text: "Partial refunds after a currency change are tested by hand; the sandbox can't fake FX.", src: ["QA-47"] },
      { title: "Bank sandbox setup", lit: false, text: "Sandbox certificates expire every 90 days; renewal steps live with the bank's portal admin.", src: ["Interview"] },
    ] },
    { name: "Priya Nair", initials: "PN", role: "Product owner", areas: [
      { title: "Q4 payments roadmap", lit: true, text: "Retries and refunds first; merchant onboarding moved to Q1 after the fee change.", src: ["PAY-100"] },
      { title: "Refund policy decisions", lit: false, text: "Refunds over 30 days need finance sign-off, agreed with the finance lead in October.", src: ["Interview"] },
      { title: "Merchant onboarding flow", lit: false, text: "Five steps, with KYC last so merchants can explore first.", src: ["PAY-160"] },
      { title: "Why the fee changed", lit: false, text: "Card scheme costs rose 0.2%; the fee change passes on half of it.", src: ["Interview"] },
    ] },
    { name: "Wei Ling", initials: "WL", role: "Developer", areas: [
      { title: "Card tokenisation", lit: true, text: "Cards are tokenised at the edge; raw numbers never reach our services.", src: ["PAY-88", PR + "201"] },
      { title: "Fraud rule engine", lit: true, text: "Rules are data, not code, so risk can change thresholds without a deploy.", src: ["PAY-93"] },
      { title: "3-D Secure flow", lit: true, text: "Challenge only above RM250 or on a new device.", src: ["PAY-97"] },
      { title: "Audit logging", lit: true, text: "Append-only, kept 7 years, written before the response is sent.", src: ["PAY-99"] },
    ] },
    { name: "Arjun Menon", initials: "AM", role: "Developer", away: "On leave · back 14 Nov", status: "On leave until 14 Nov", areas: [
      { title: "Reconciliation report", lit: true, text: "Runs at 06:00 and flags any gap over RM1 between ledger and bank.", src: ["PAY-140"] },
      { title: "FX rate cache", lit: false, text: "Rates refresh every 15 minutes; a stale rate older than 1 hour blocks payment.", src: ["PAY-145"] },
      { title: "Ledger export", lit: false, text: "Finance imports the CSV at 07:00, so the export must finish by 06:45.", src: ["PAY-146"] },
    ] },
  ];
  const litCount = (p) => p.areas.filter((a) => a.lit).length;

  // ---------- Renderer, camera, post-processing ----------
  const canvas = document.getElementById("scene");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (e) { throw new Error("No WebGL: the 2D street stays."); }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.classList.add("has-3d");

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(tok("--pl-3d-sky"), 0.016);
  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
  const OVERVIEW = { pos: new THREE.Vector3(0, 6.4, 27), look: new THREE.Vector3(0, 2.4, 0) };
  camera.position.copy(OVERVIEW.pos);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.4, 0.82);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ---------- Sky: gradient dome, stars, moon ----------
  const sky = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: tok("--pl-3d-sky-top") }, horizon: { value: tok("--pl-3d-sky") } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float t = smoothstep(-0.05, 0.6, vP.y); gl_FragColor = vec4(mix(horizon, top, t), 1.0); }",
  }));
  scene.add(sky);

  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 700; i++) {
    // Stars on a far backdrop, kept above the rooftops and inside the camera's view.
    starPos.push((Math.random() - 0.5) * 150, 7 + Math.pow(Math.random(), 0.7) * 32, -62 - Math.random() * 10);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: tok("--pl-3d-moon"), size: 0.26, sizeAttenuation: true, transparent: true, opacity: 0.8, fog: false }));
  scene.add(stars);

  // A soft round sprite, drawn once, reused for halos and fireflies.
  const softTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"); const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(0.35, "rgba(255,255,255,0.35)"); grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();

  const moonPos = new THREE.Vector3(-5, 12.5, -46);
  const moon = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 16), new THREE.MeshBasicMaterial({ color: tok("--pl-3d-moon"), fog: false }));
  moon.position.copy(moonPos); scene.add(moon);
  const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: tok("--pl-3d-moon"), transparent: true, opacity: 0.35, depthWrite: false, fog: false }));
  moonHalo.scale.set(14, 14, 1); moonHalo.position.copy(moonPos); scene.add(moonHalo);

  // ---------- Light ----------
  scene.add(new THREE.HemisphereLight(tok("--pl-3d-moon"), tok("--pl-3d-ground"), 1.0));
  const moonLight = new THREE.DirectionalLight(tok("--pl-3d-moon"), 1.25);
  moonLight.position.set(-14, 18, 10);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(1024, 1024);
  Object.assign(moonLight.shadow.camera, { left: -18, right: 18, top: 12, bottom: -8, near: 1, far: 60 });
  moonLight.shadow.bias = -0.0008;
  scene.add(moonLight);

  // ---------- Ground, pavement, road ----------
  const mat = (name, opts = {}) => new THREE.MeshStandardMaterial({ color: tok(name), roughness: 0.95, ...opts });
  const plane = (w, d, m, y, z, x = 0) => { const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m); p.rotation.x = -Math.PI / 2; p.position.set(x, y, z); p.receiveShadow = true; scene.add(p); return p; };
  plane(160, 80, mat("--pl-3d-ground"), 0, -10);
  plane(160, 1.6, mat("--pl-3d-trim", { roughness: 0.9 }), 0.01, 3.4);          // pavement
  plane(160, 4.4, mat("--pl-3d-road", { roughness: 0.7, metalness: 0.1 }), 0.012, 6.4);   // road, a little wet
  const dashMat = new THREE.MeshBasicMaterial({ color: tok("--pl-3d-line") });
  for (let x = -40; x <= 40; x += 2.4) plane(1.1, 0.08, dashMat, 0.02, 6.4, x);

  // ---------- Small building blocks ----------
  const box = (w, h, d, m, x, y, z, parent) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; parent.add(b); return b; };
  const amber = tok("--pl-glow"), amberHot = tok("--pl-glow-hot");
  const trimMat = mat("--pl-3d-trim"), roofMat = mat("--pl-3d-roof", { roughness: 0.8 });

  function gableRoof(w, d, rise) {
    const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, rise); s.lineTo(-w / 2, 0);
    const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false }); g.translate(0, 0, -d / 2);
    const m = new THREE.Mesh(g, roofMat); m.castShadow = m.receiveShadow = true; return m;
  }
  function tree(x, z, s = 1) {
    const g = new THREE.Group(); const leaf = mat("--pl-3d-tree", { flatShading: true });
    box(0.18 * s, 0.9 * s, 0.18 * s, roofMat, 0, 0.45 * s, 0, g);
    [[1.1, 1.6, 1.2], [0.85, 1.3, 1.9], [0.55, 1.0, 2.5]].forEach(([r, h, y]) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 7), leaf); c.position.y = y * s; c.castShadow = true; g.add(c);
    });
    g.position.set(x, 0, z); g.rotation.y = Math.random() * Math.PI; scene.add(g);
  }
  function streetLamp(x) {
    const g = new THREE.Group();
    box(0.08, 3.2, 0.08, roofMat, 0, 1.6, 0, g);
    box(0.5, 0.06, 0.06, roofMat, 0.22, 3.18, 0, g);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 8), new THREE.MeshBasicMaterial({ color: amberHot }));
    head.position.set(0.44, 3.08, 0); g.add(head);
    const l = new THREE.PointLight(amber, 5, 7, 2); l.position.set(0.44, 2.95, 0); g.add(l);
    g.position.set(x, 0, 4.1); scene.add(g);
  }

  // ---------- Houses ----------
  const houses = [];       // { group, body, top: Vector3, person, windows: [] }
  const SPACING = 5.2;
  TEAM.forEach((person, i) => {
    const g = new THREE.Group();
    const x = (i - (TEAM.length - 1) / 2) * SPACING;
    const z = -Math.abs(i - (TEAM.length - 1) / 2) * 0.7;
    g.position.set(x, 0, z);
    g.rotation.y = (i - (TEAM.length - 1) / 2) * -0.05;    // houses turn slightly toward the viewer

    const rows = Math.ceil(person.areas.length / 2);
    const w = 3.0, d = 2.6, h = 1.55 + rows * 0.8;
    const wallMat = mat("--pl-3d-house");
    const body = box(w, h, d, wallMat, 0, h / 2, 0, g);
    box(w + 0.1, 0.12, d + 0.1, trimMat, 0, h, 0, g);                  // eave trim
    const roof = gableRoof(w + 0.5, d + 0.5, 1.25); roof.position.y = h + 0.06; g.add(roof);
    if (i % 2 === 0) box(0.36, 0.9, 0.36, trimMat, w * 0.28, h + 0.85, -0.3, g);   // chimney on some houses

    // Door, porch canopy, posts and steps.
    box(0.62, 1.05, 0.06, roofMat, 0, 0.6, d / 2 + 0.02, g);
    box(1.6, 0.08, 0.85, trimMat, 0, 1.38, d / 2 + 0.42, g);
    [-0.72, 0.72].forEach((px) => box(0.06, 1.3, 0.06, trimMat, px, 0.7, d / 2 + 0.8, g));
    box(1.3, 0.1, 0.5, trimMat, 0, 0.05, d / 2 + 0.35, g);
    box(1.1, 0.1, 0.35, trimMat, 0, 0.12, d / 2 + 0.25, g);

    // The porch light is presence. ON: this person is away or leaving, and their lit windows are what they
    // left for you. OFF: they're here, so just ask them.
    const porchOn = Boolean(person.away);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 8), new THREE.MeshBasicMaterial({ color: porchOn ? amberHot : tok("--pl-3d-roof") }));
    lamp.position.set(0.5, 1.22, d / 2 + 0.12); g.add(lamp);
    if (porchOn) {
      const porch = new THREE.PointLight(amber, 10, 7, 2); porch.position.set(0.5, 1.15, d / 2 + 0.45); g.add(porch);
      const lampHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: amber, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending }));
      lampHalo.scale.set(1.1, 1.1, 1); lampHalo.position.copy(lamp.position); g.add(lampHalo);
      // A warm pool of light on the path to the door.
      const pool = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), new THREE.MeshBasicMaterial({ map: softTex, color: amber, transparent: true, opacity: 0.32, depthWrite: false, blending: THREE.AdditiveBlending }));
      pool.rotation.x = -Math.PI / 2; pool.position.set(0.2, 0.03, d / 2 + 1.1); g.add(pool);
    }

    // Windows: two columns, framed, with mullions. Lit panes glow (bloom picks them up).
    const windows = [];
    person.areas.forEach((area, k) => {
      const col = k % 2, row = Math.floor(k / 2);
      const wx = (col - 0.5) * 1.3, wy = h - 0.6 - row * 0.8, wz = d / 2 + 0.03;
      box(0.66, 0.66, 0.05, trimMat, wx, wy, wz - 0.01, g);
      const pane = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.54), new THREE.MeshStandardMaterial({ color: tok("--pl-3d-window-dark"), emissive: amber, emissiveIntensity: 0, roughness: 0.3 }));
      pane.position.set(wx, wy, wz + 0.02); g.add(pane);
      box(0.54, 0.035, 0.02, trimMat, wx, wy, wz + 0.035, g);
      box(0.035, 0.54, 0.02, trimMat, wx, wy, wz + 0.035, g);
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: amber, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
      halo.scale.set(1.9, 1.9, 1); halo.position.set(wx, wy, wz + 0.15); g.add(halo);
      windows.push({ pane, halo, area, startAt: 0 });
    });

    // A short picket fence in front of each garden.
    const picket = new THREE.BoxGeometry(0.07, 0.55, 0.04);
    const fence = new THREE.InstancedMesh(picket, trimMat, 24);
    let n = 0;
    for (let s = -1; s <= 1; s += 2) for (let p = 0; p < 12; p++) {
      const m4 = new THREE.Matrix4().makeTranslation(s * (0.95 + p * 0.16), 0.28, d / 2 + 1.55);
      fence.setMatrixAt(n++, m4);
    }
    fence.castShadow = true; g.add(fence);
    box(1.9 * 1.0, 0.05, 0.05, trimMat, -1.83, 0.45, d / 2 + 1.55, g);
    box(1.9 * 1.0, 0.05, 0.05, trimMat, 1.83, 0.45, d / 2 + 1.55, g);

    body.userData.index = i;
    g.traverse((o) => { if (o.isMesh) o.userData.index = i; });
    scene.add(g);
    houses.push({ group: g, body, wallMat, person, windows, top: new THREE.Vector3(0, h + 1.9, 0) });
  });

  // Trees between and behind the houses; lamps along the pavement.
  [-15.5, -7.8, -2.6, 2.6, 7.8, 15.5].forEach((x, k) => tree(x, -2.6 - (k % 2) * 1.2, 0.9 + (k % 3) * 0.15));
  [-18, -11, 11, 18, -21, 21].forEach((x, k) => tree(x, -7 - k * 0.6, 1.3));
  [-2.6, 2.6, -13, 13].forEach(streetLamp);   // lamps stand between houses, never in front of a door

  // Fireflies: a few warm motes drifting near the houses. Alive, never busy.
  const FLY = 70, flyGeo = new THREE.BufferGeometry(), flyBase = [];
  const flyPos = new Float32Array(FLY * 3);
  for (let i = 0; i < FLY; i++) flyBase.push([(Math.random() - 0.5) * 30, 0.4 + Math.random() * 2.4, 1.5 + Math.random() * 3.5, Math.random() * 10]);
  flyGeo.setAttribute("position", new THREE.BufferAttribute(flyPos, 3));
  const flies = new THREE.Points(flyGeo, new THREE.PointsMaterial({ map: softTex, color: amber, size: 0.32, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(flies);

  // ---------- Lighting the windows: warm up, then rest ----------
  // Captured windows warm up one by one when the street first loads.
  let order = 0;
  houses.forEach((h) => h.windows.forEach((w) => { if (w.area.lit) w.startAt = reduced ? -1e9 : 500 + order++ * 110; }));
  function level(w, now) {
    if (!w.area.lit) return 0;
    const t = Math.min(Math.max((now - w.startAt) / 600, 0), 1);
    const warm = 1 - Math.pow(1 - t, 3);
    const since = now - w.startAt - 600;
    const breathe = since > 0 && since < 3000 ? 0.18 * Math.abs(Math.sin((since / 1000) * Math.PI)) : 0;
    return warm * (1 - breathe);
  }

  // ---------- Name tags, dock and team line (HTML over the canvas) ----------
  const tagsEl = document.getElementById("tags"), dock = document.getElementById("dock");
  const meter = (p) => `<span class="pl-meter" aria-hidden="true">${p.areas.map((a) => `<span class="pl-meter__win${a.lit ? " pl-meter__win--lit" : ""}"></span>`).join("")}</span>`;
  const tags = houses.map((h) => { const t = document.createElement("div"); t.className = "pl-tag"; tagsEl.appendChild(t); return t; });
  const dockBtns = houses.map((h, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "dock__btn";
    b.addEventListener("click", () => visit(i)); b.addEventListener("mouseenter", () => setFocus(i)); dock.appendChild(b); return b;
  });
  function refreshLabels() {
    // Static demo data only; real names will be escaped when they come from Jira.
    const total = TEAM.reduce((s, p) => s + p.areas.length, 0), lit = TEAM.reduce((s, p) => s + litCount(p), 0);
    document.getElementById("team-line").textContent = `Payments team · ${TEAM.length} people · ${lit} of ${total} areas captured`;
    houses.forEach((h, i) => {
      const p = h.person;
      const presence = `<span class="pl-presence${p.away ? " pl-presence--away" : ""}"><span class="pl-presence__lamp"></span>${p.away || "Here"}</span>`;
      tags[i].classList.toggle("pl-tag--away", Boolean(p.away));
      tags[i].innerHTML = `<span class="pl-tag__row"><strong>${p.name}</strong><span class="area-count">${litCount(p)}/${p.areas.length}</span></span>${presence}`;
      dockBtns[i].innerHTML = `<span class="dock__name"><span class="pl-avatar">${p.initials}</span>${p.name.split(" ")[0]}</span>${meter(p)}${presence}`;
      dockBtns[i].setAttribute("aria-label", `${p.name}, ${p.role}, ${p.away || "here"}, ${litCount(p)} of ${p.areas.length} areas captured`);
    });
  }
  refreshLabels();
  // Deep link for demos and screenshots: ?visit=0 opens the first teammate's house.
  const deep = new URLSearchParams(location.search).get("visit");

  // ---------- Focus, visit and leave (camera flight) ----------
  let focus = -1, current = -1, fly = null;
  function setFocus(i) {
    focus = i;
    houses.forEach((h, k) => {
      h.wallMat.emissive.copy(amber).multiplyScalar(k === i ? 0.05 : 0);
      tags[k].classList.toggle("is-active", k === i);
      dockBtns[k].classList.toggle("is-active", k === i);
    });
  }
  // Smootherstep: zero speed and zero acceleration at both ends, so a move eases in and settles softly.
  const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const lookNow = OVERVIEW.look.clone();
  const BASE_FOV = 34, HOUSE_FOV = 30;      // a slight lens push when arriving at a house
  let driftFrom = performance.now();       // the idle drift blends back in from this moment

  // Fly the camera along a curve (a quadratic Bezier: from -> control point -> to).
  // From the street view, the camera first pans along the road toward the house, then turns in.
  // Between neighbours, it arcs out over the road and back in, never through the gardens.
  // The look leads the move a little, the way a person looks before they walk.
  function flyTo(pos, look, { fov = BASE_FOV, onArrive = null } = {}) {
    if (reduced) { camera.position.copy(pos); lookNow.copy(look); camera.fov = fov; camera.updateProjectionMatrix(); onArrive?.(); return; }
    const fromP = camera.position.clone(), dist = fromP.distanceTo(pos), dx = Math.abs(pos.x - fromP.x);
    const sideways = Math.abs(fromP.z - pos.z) < 2;   // house to house: arc out over the road
    const ctrl = new THREE.Vector3(
      fromP.x + (pos.x - fromP.x) * 0.8,
      Math.max(fromP.y, pos.y) + 0.4,
      Math.max(fromP.z, pos.z) + (sideways ? Math.min(3.5, dx * 0.35) : 0));
    fly = { fromP, ctrl, toP: pos, fromL: lookNow.clone(), toL: look, fromFov: camera.fov, toFov: fov,
            t0: performance.now(), dur: Math.min(2600, 1300 + dist * 55), onArrive, arrived: false };
  }
  function visit(i) {
    if (i === current) return;
    current = i; setFocus(i);
    panel.classList.remove("is-open"); panel.setAttribute("aria-hidden", "true");
    const h = houses[i], wp = new THREE.Vector3(); h.group.getWorldPosition(wp);
    // Frame the house left of centre, leaving room for the panel on the right.
    // The panel opens as the camera settles, not at the click.
    flyTo(new THREE.Vector3(wp.x + 2.6, 3.4, wp.z + 12.5), new THREE.Vector3(wp.x + 2.2, 2.5, wp.z),
          { fov: HOUSE_FOV, onArrive: () => { if (current === i) openPanel(i); } });
    document.body.classList.add("is-zoomed");
  }
  function leave() {
    if (current < 0) return;
    current = -1; flyTo(OVERVIEW.pos.clone(), OVERVIEW.look.clone(), { fov: BASE_FOV });
    document.body.classList.remove("is-zoomed");
    panel.classList.remove("is-open"); panel.setAttribute("aria-hidden", "true");
    dockBtns[focus]?.focus();
  }

  // ---------- Panel: one teammate's work areas ----------
  const panel = document.getElementById("panel");
  const chipIcon = (s) => s.startsWith("PR") ? "pull-request" : s === "Interview" ? "interview" : "ticket";
  function areaCard(a, idx) {
    const first = TEAM[current].name.split(" ")[0];
    const chips = a.src.map((s) => `<a class="pl-chip" href="#"><svg class="pl-glyph pl-glyph--sm" aria-hidden="true"><use href="#${chipIcon(s)}"/></svg>${s === "Interview" ? "Interview · " + first : s}</a>`).join("");
    return a.lit
      ? `<article class="pl-card pl-card--lit" data-i="${idx}"><span class="pl-card__glow" aria-hidden="true"></span><div class="pl-card__head"><p class="pl-card__title">${a.title}</p></div><p class="pl-card__body">${a.text}</p><div class="pl-card__sources">${chips}</div></article>`
      : `<article class="pl-card pl-card--unlit" data-i="${idx}"><span class="pl-card__glow" aria-hidden="true"></span><div class="pl-card__head"><p class="pl-card__title">${a.title}</p><span class="pl-meta">Not captured yet</span></div><p class="pl-card__body">Only ${first} knows this.</p><div style="display:flex; gap: var(--ds-space-100)"><button class="pl-btn pl-btn--primary" type="button" data-capture="${idx}"><svg class="pl-glyph pl-glyph--sm" aria-hidden="true"><use href="#lamp"/></svg>Capture</button><button class="pl-btn pl-btn--secondary" type="button">Ask ${first}</button></div></article>`;
  }
  function renderHead(i) {
    const p = TEAM[i];
    document.getElementById("panel-head").innerHTML =
      `<div class="pl-panel__who"><span class="pl-avatar pl-avatar--lg">${p.initials}</span><div><p class="pl-panel__name">${p.name}</p><p class="pl-meta" style="margin:0">${p.role}</p><span class="pl-presence${p.away ? " pl-presence--away" : ""}"><span class="pl-presence__lamp"></span>${p.status || "Here · ask them directly"}</span></div></div>
       <div style="display:flex; gap: var(--ds-space-150); align-items:center">${meter(p)}<span class="area-count">${litCount(p)} of ${p.areas.length} areas captured</span></div>`;
  }
  function openPanel(i) {
    renderHead(i);
    document.getElementById("panel-body").innerHTML = TEAM[i].areas.map(areaCard).join("");
    panel.classList.add("is-open"); panel.setAttribute("aria-hidden", "false");
    document.getElementById("back").focus({ preventScroll: true });
  }
  // "Capture": the gap is filled (as if the interview just answered it). Card and window both warm up.
  document.getElementById("panel-body").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-capture]"); if (!btn) return;
    const idx = Number(btn.dataset.capture), area = TEAM[current].areas[idx];
    area.lit = true; houses[current].windows[idx].startAt = performance.now();
    const old = btn.closest(".pl-card"); const tmp = document.createElement("div"); tmp.innerHTML = areaCard(area, idx);
    const fresh = tmp.firstElementChild; fresh.classList.add("pl-warming"); old.replaceWith(fresh);
    refreshLabels(); renderHead(current);
  });
  document.getElementById("back").addEventListener("click", leave);

  // ---------- Pointer and keyboard ----------
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  const pickables = []; houses.forEach((h) => h.group.traverse((o) => { if (o.isMesh) pickables.push(o); }));
  function pick(ev) {
    const r = canvas.getBoundingClientRect();
    mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.index : -1;
  }
  canvas.addEventListener("pointermove", (ev) => { const i = pick(ev); canvas.classList.toggle("is-pointing", i >= 0); if (i >= 0 && current < 0) setFocus(i); });
  canvas.addEventListener("click", (ev) => { const i = pick(ev); if (i >= 0) visit(i); else if (current >= 0) leave(); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return leave();
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const next = (Math.max(focus, 0) + (e.key === "ArrowRight" ? 1 : TEAM.length - 1)) % TEAM.length;
      if (current >= 0) visit(next); else { setFocus(next); dockBtns[next].focus(); }
      e.preventDefault();
    }
    if (e.key === "Enter" && current < 0 && focus >= 0 && document.activeElement === document.body) visit(focus);
  });

  // ---------- Resize and render loop ----------
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false); composer.setSize(w, h); bloom.resolution.set(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();
  if (deep !== null) setTimeout(() => visit(Number(deep) || 0), 300);

  const v = new THREE.Vector3(), t0 = performance.now();
  renderer.setAnimationLoop((now) => {
    const s = (now - t0) / 1000;
    // Windows
    houses.forEach((h) => h.windows.forEach((w) => { const l = level(w, now); w.pane.material.emissiveIntensity = l * 1.0; w.halo.material.opacity = l * 0.28; }));
    // Fireflies
    if (!reduced) for (let i = 0; i < FLY; i++) {
      const [bx, by, bz, ph] = flyBase[i];
      flyPos[i * 3] = bx + Math.sin(s * 0.3 + ph) * 0.6; flyPos[i * 3 + 1] = by + Math.sin(s * 0.7 + ph * 2) * 0.25; flyPos[i * 3 + 2] = bz + Math.cos(s * 0.25 + ph) * 0.5;
    } else if (s < 0.1) for (let i = 0; i < FLY; i++) flyPos.set(flyBase[i].slice(0, 3), i * 3);
    flyGeo.attributes.position.needsUpdate = true;
    flies.material.opacity = reduced ? 0.6 : 0.55 + 0.35 * Math.sin(s * 1.3);
    // Camera: fly when asked; otherwise a very slow drift over the street.
    if (fly) {
      const k = Math.min((now - fly.t0) / fly.dur, 1);
      const e = smoother(k), eL = smoother(Math.min(1, k * 1.2)), a = 1 - e;
      camera.position.set(0, 0, 0).addScaledVector(fly.fromP, a * a).addScaledVector(fly.ctrl, 2 * a * e).addScaledVector(fly.toP, e * e);
      lookNow.lerpVectors(fly.fromL, fly.toL, eL);
      camera.fov = fly.fromFov + (fly.toFov - fly.fromFov) * e; camera.updateProjectionMatrix();
      if (!fly.arrived && k >= 0.7) { fly.arrived = true; fly.onArrive?.(); }
      if (k === 1) { fly = null; driftFrom = now; }
    } else if (current < 0 && !reduced) {
      // The idle drift starts from zero and blends in over 3 seconds after landing, so nothing jumps.
      const ds = (now - driftFrom) / 1000, wb = smoother(Math.min(ds / 3, 1));
      camera.position.x = OVERVIEW.pos.x + Math.sin(ds * 0.06) * 1.8 * wb;
      camera.position.y = OVERVIEW.pos.y + Math.sin(ds * 0.04) * 0.2 * wb;
    }
    camera.lookAt(lookNow);
    // Tags follow their houses on screen.
    const r = canvas.getBoundingClientRect();
    houses.forEach((h, i) => {
      v.copy(h.top); h.group.localToWorld(v); v.project(camera);
      tags[i].style.transform = `translate(${(v.x * 0.5 + 0.5) * r.width}px, ${(-v.y * 0.5 + 0.5) * r.height}px) translate(-50%, -100%)`;
      tags[i].classList.toggle("is-hidden", current >= 0 && current !== i);
    });
    composer.render();
  });
</script>
<script data-sprite="../assets/icons.svg">
  // Load the icon sprite into this page once, so every <use href="#id"> resolves locally.
  fetch(document.currentScript.dataset.sprite).then((r) => r.text()).then((svg) => {
    const box = document.createElement("div");
    box.setAttribute("aria-hidden", "true");
    box.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
    box.innerHTML = svg; document.body.prepend(box);
  });
</script>
</body>
</html>
