modules:
  # The page people open from Jira's Apps menu.
  # It is Custom UI: our own React build in static/porchlight-ui/dist (decision D2).
  jira:globalPage:
    - key: porchlight-page
      resource: main
      resolver:
        function: resolver
      title: Porchlight
      # Two subpages in Jira's sidebar: Porchlight > Team and Porchlight > Notes
      # (decision D20). The page reads the open route with view.createHistory().
      pages:
        - title: Team
          route: team
        - title: Notes
          route: notes

  function:
    # Answers the page's invoke() calls: the notes and the team list.
    - key: resolver
      handler: index.handler
    # Creates and updates the database tables.
    - key: migrate
      handler: index.migrate

  # Forge runs migrations from a trigger. The resolvers also run them on their
  # first call, so the app works before the first hourly run (spec ledger O7).
  scheduledTrigger:
    - key: porchlight-migrate-hourly
      function: migrate
      interval: hour

  # One Forge SQL database for each installation of the app.
  sql:
    - key: main
      engine: mysql

resources:
  - key: main
    path: static/porchlight-ui/dist

permissions:
  scopes:
    # Look up the authors' display names as the viewer (decision D12).
    - read:jira-user
    # Search a teammate's tickets, with their history and comments, as the viewer
    # (catch-up-view scenarios 3 to 5).
    - read:jira-work
  # No content.styles permission: inline styles stay blocked (decision D15).

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0eed6567-84e7-45fa-865b-80463e0c7d9e
